workflows:
  android-ndk-debug:
    name: Android NDK Debug Build
    max_build_duration: 60

    environment:
      java: 17
      ndk: r21d
    scripts:

      - name: Clean
        script: ./gradlew clean

      - name: Build Debug APK
        script: ./gradlew assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/**/*.apk
