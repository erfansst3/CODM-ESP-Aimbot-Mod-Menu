workflows:
  android-ndk-debug:
    name: Android NDK Debug Build
    max_build_duration: 60

    environment:
      java: 17

    scripts:

      - name: Accept licenses
        script: yes | $SDKMANAGER --licenses

      - name: Install NDK 25.1
        script: $SDKMANAGER "ndk;25.1.8937393"

      - name: Gradle permissions
        script: chmod +x ./gradlew

      - name: Clean
        script: ./gradlew clean

      - name: Build Debug APK
        script: ./gradlew assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/**/*.apk
