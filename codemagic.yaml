workflows:
  android-ndk-debug:
    name: Android NDK Debug Build
    max_build_duration: 60

    environment:
      java: 17
      vars:
        ANDROID_HOME: /usr/local/android-sdk
        SDKMANAGER: /usr/local/android-sdk/cmdline-tools/latest/bin/sdkmanager

    scripts:
      - name: Accept licenses
        script: yes | $SDKMANAGER --licenses

      - name: Install NDK only
        script: |
          $SDKMANAGER "ndk;25.1.8937393"

      - name: Set permissions for Gradle
        script: chmod +x ./gradlew

      - name: Clean project
        script: ./gradlew clean

      - name: Build Debug APK with NDK
        script: ./gradlew assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/**/*.apk
