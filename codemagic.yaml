workflows:
  android-ndk-debug:
    name: Android NDK Debug Build
    max_build_duration: 60
    environment:
      java: "17"
      android:
        build_tools_version: "34.0.0"
        command_line_tools_version: "12.0"
        ndk: "25.1.8937393" 
    scripts:
      - name: Prepare Gradle
        script: chmod +x ./gradlew

      - name: Clean project
        script: ./gradlew clean

      - name: Build Debug APK (NDK)
        script: ./gradlew assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/**/*.apk

    triggering:
      events:
        - push
        - pull_request
