workflows:
  android-ndk-debug:
    name: Android NDK Debug Build
    max_build_duration: 60

    environment:
      java: 17
      vars:
        ANDROID_HOME: /usr/local/android-sdk
        SDKMANAGER: /usr/local/android-sdk/cmdline-tools/latest/bin/sdkmanager

    scripts:
      - name: Install Android SDK + Tools
        script: |
          sudo mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          sudo wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
          sudo unzip cmdline.zip -d latest
          yes | $SDKMANAGER --licenses
          $SDKMANAGER "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install NDK
        script: |
          $SDKMANAGER "ndk;25.1.8937393"

      - name: Set permissions for Gradle
        script: chmod +x ./gradlew

      - name: Clean project
        script: ./gradlew clean

      - name: Build Debug APK with NDK
        script: ./gradlew assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/**/*.apk
