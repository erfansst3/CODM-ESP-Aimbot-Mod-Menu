version: 2.1

jobs:
  build-android:
    docker:
      - image: cimg/android:2024.01   # شامل SDK، cmdline-tools، JDK

    working_directory: ~/project

    environment:
      GRADLE_OPTS: "-Xmx4g"
      ANDROID_HOME: /opt/android/sdk

    steps:
      - checkout

      - run:
          name: Accept licenses
          command: yes | sdkmanager --licenses

      - run:
          name: Install NDK 25.1
          command: sdkmanager "ndk;25.1.8937393"

      - run:
          name: Verify NDK path
          command: ls -R /opt/android/sdk/ndk

      - run:
          name: Grant Gradle permissions
          command: chmod +x ./gradlew

      - run:
          name: Clean project
          command: ./gradlew clean

      - run:
          name: Build Debug APK (NDK)
          command: ./gradlew assembleDebug --stacktrace

      - store_artifacts:
          path: app/build/outputs/apk/
          destination: apk-output

workflows:
  build:
    jobs:
      - build-android
